[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boulevard-boosting"
version = "0.1.0a1"
description = "Scikit-learn-compatible Boulevard and BRAT estimators with uncertainty intervals."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Yichen Zhou, Kevin Tan, Giles Hooker, Haimo Fang" }
]
keywords = [
    "boosting",
    "gradient boosting",
    "uncertainty quantification",
    "statistical inference",
    "scikit-learn",
    "machine learning"
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.22",
    "joblib>=1.3",
    "scikit-learn>=1.8,<1.9",
]

[project.urls]
Homepage = "https://github.com/boosting-inference/Boulevard"
Repository = "https://github.com/boosting-inference/Boulevard"
Issues = "https://github.com/boosting-inference/Boulevard/issues"

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "matplotlib>=3.8",
    "nbformat>=5.9",
    "pytest>=7.0",
    "ruff>=0.4",
    "black>=24.0",
]

examples = [
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
