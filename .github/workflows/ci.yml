name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint-test-build:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    env:
      LOKY_MAX_CPU_COUNT: "2"
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests examples docs README.md

      - name: Test
        run: python -m pytest -q

      - name: Build package
        run: python -m build --sdist --wheel --outdir dist

      - name: Inspect built artifacts
        run: |
          python - <<'PY'
          import pathlib

          dist = pathlib.Path("dist")
          artifacts = sorted(path.name for path in dist.iterdir())
          print("\n".join(artifacts))
          assert any(name.endswith(".whl") for name in artifacts)
          assert any(name.endswith(".tar.gz") for name in artifacts)
          PY
