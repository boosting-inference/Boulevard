name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint-test-build:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    env:
      LOKY_MAX_CPU_COUNT: "2"
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests examples docs README.md

      - name: Test
        run: python -m pytest -q

      - name: Build package
        run: python -m build --sdist --wheel --outdir dist

      - name: Inspect built artifacts
        run: |
          python - <<'PY'
          import pathlib

          dist = pathlib.Path("dist")
          artifacts = sorted(path.name for path in dist.iterdir())
          print("\n".join(artifacts))
          assert any(name.endswith(".whl") for name in artifacts)
          assert any(name.endswith(".tar.gz") for name in artifacts)
          PY

      - name: Smoke test installed wheel
        run: |
          WHEEL_PATH="$(python - <<'PY'
          import pathlib

          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          print(wheels[0])
          PY
          )"

          python -m venv /tmp/boulevard-wheel-smoke
          /tmp/boulevard-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/boulevard-wheel-smoke/bin/python -m pip install "$WHEEL_PATH"
          /tmp/boulevard-wheel-smoke/bin/python -m pip check
          /tmp/boulevard-wheel-smoke/bin/python - <<'PY'
          import numpy as np
          import boulevard as bd

          assert bd.__version__ == "0.1.0a1"
          assert hasattr(bd, "BRATDHistGradientBoostingRegressor")
          assert hasattr(bd, "BRATPHistGradientBoostingRegressor")
          assert hasattr(bd, "IEBMRegressor")
          assert not hasattr(bd, "XGBRegressor")

          rng = np.random.default_rng(0)
          X = rng.uniform(size=(90, 2))
          y = np.sin(2 * np.pi * X[:, 0]) + rng.normal(scale=0.1, size=90)

          bratd = bd.BRATDHistGradientBoostingRegressor(
              max_iter=3,
              learning_rate=0.5,
              dropout_rate=0.2,
              max_leaf_nodes=4,
              min_samples_leaf=4,
              max_bins=16,
              early_stopping=False,
              random_state=0,
          )
          bratd.fit(X[:60], y[:60])
          bratd.prepare_inference(X[60:], y[60:])
          pred = bratd.predict(X[60:65])
          lower, upper = bratd.confidence_interval(X[60:65])
          assert pred.shape == lower.shape == upper.shape == (5,)
          assert np.all(lower <= upper)

          bratp = bd.BRATPHistGradientBoostingRegressor(
              n_rounds=2,
              trees_per_round=2,
              max_leaf_nodes=4,
              min_samples_leaf=4,
              max_bins=16,
              early_stopping=False,
              random_state=0,
          )
          bratp.fit(X[:60], y[:60])
          bratp.prepare_inference(X[60:], y[60:])
          pred = bratp.predict(X[60:65])
          lower, upper = bratp.confidence_interval(X[60:65])
          assert pred.shape == lower.shape == upper.shape == (5,)
          assert np.all(lower <= upper)

          iebm = bd.IEBMRegressor(
              max_rounds=4,
              max_bins=8,
              max_depth=1,
              min_samples_leaf=4,
              random_state=0,
          )
          iebm.fit(X[:60], y[:60])
          iebm.prepare_inference(X[60:], y[60:])
          lower, upper, pred = iebm.predict_intervals(X[60:65], mode="confidence")
          assert pred.shape == lower.shape == upper.shape == (5,)
          assert np.all(lower <= pred)
          assert np.all(pred <= upper)
          PY
